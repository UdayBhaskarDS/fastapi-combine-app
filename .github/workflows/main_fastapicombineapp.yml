# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - fastapicombineapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://fastapicombineapp.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_c690b1189ea7486c875851406b277970 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_7cf4036e73a34f2ebc4a7e53118b17ef }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: fastapicombineapp.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_c690b1189ea7486c875851406b277970 }}/fastapi:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'fastapicombineapp'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_ea8aabb5ba3d46958d577ff9ecc8f0bf }}
        images: 'fastapicombineapp.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_c690b1189ea7486c875851406b277970 }}/fastapi:${{ github.sha }}'